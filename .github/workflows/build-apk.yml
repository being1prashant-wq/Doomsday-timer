name: Build Doomsday APK

on:
  push:
    branches: [ "main", "master", "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Assemble Debug & Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Normalize Versions for Public GitHub Actions Runner
        run: |
          # AI Studio uses an internal container mirror with AGP 9.1.1 / Gradle 9.3.1 / compileSdk 36.1.
          # When running on public GitHub Actions runners against Google Maven & Gradle distributions,
          # normalize to publicly released stable versions so dependency resolution succeeds cleanly.
          sed -i 's/agp = "9.1.1"/agp = "8.8.0"/g' gradle/libs.versions.toml
          sed -i 's/coreKtx = "1.18.0"/coreKtx = "1.15.0"/g' gradle/libs.versions.toml
          sed -i 's/junitVersion = "1.3.0"/junitVersion = "1.2.1"/g' gradle/libs.versions.toml
          sed -i 's/espressoCore = "3.7.0"/espressoCore = "3.6.1"/g' gradle/libs.versions.toml
          sed -i 's/kotlin = "2.2.10"/kotlin = "2.1.0"/g' gradle/libs.versions.toml
          sed -i 's/googleDevtoolsKsp = "2.3.5"/googleDevtoolsKsp = "2.1.0-1.0.29"/g' gradle/libs.versions.toml
          sed -i 's/robolectric = "4.16.1"/robolectric = "4.14.1"/g' gradle/libs.versions.toml
          sed -i 's/googleServices = "4.5.0"/googleServices = "4.4.2"/g' gradle/libs.versions.toml
          sed -i 's/gradle-9.3.1-bin.zip/gradle-8.11.1-bin.zip/g' gradle/wrapper/gradle-wrapper.properties

          # Replace AGP 9 compileSdk DSL block with standard compileSdk = 35 & targetSdk = 35 for public SDK
          sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 35/g' app/build.gradle.kts
          sed -i 's/targetSdk = 36/targetSdk = 35/g' app/build.gradle.kts

          # Ensure kotlin-android plugin is present in AGP 8.x
          if ! grep -q "kotlin-android" gradle/libs.versions.toml; then
            sed -i '/\[plugins\]/a kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }' gradle/libs.versions.toml
            sed -i '/alias(libs.plugins.android.application)/a \  alias(libs.plugins.kotlin.android) apply false' build.gradle.kts
            sed -i '/alias(libs.plugins.android.application)/a \  alias(libs.plugins.kotlin.android)' app/build.gradle.kts
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Signing Keystore & Environment Files
        run: |
          # Ensure .env exists for the Secrets Gradle Plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Restore debug.keystore from debug.keystore.base64 if present, or generate a valid Android debug keystore
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # Create dummy release keystore so release signingConfig block never errors during configuration
          if [ ! -f my-upload-key.jks ]; then
            cp debug.keystore my-upload-key.jks
          fi

      - name: Run Unit Tests
        run: |
          gradle :app:testDebugUnitTest --no-daemon --no-configuration-cache

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --no-configuration-cache

      - name: Upload Doomsday Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Doomsday-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
