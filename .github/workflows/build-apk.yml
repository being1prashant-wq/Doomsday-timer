name: Build Doomsday APK

on:
  push:
    branches: [ "main", "master", "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Assemble Debug & Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Pre-Installed Android SDK & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"
          printf "\nd975f751698a77b662f1254ddbeed3901e976f5a" > "$SDK_DIR/licenses/intel-android-extra-license"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Normalize Build Config for Public GitHub Actions Runner
        run: |
          # 1. Normalize internal AI Studio container versions to publicly available Maven versions
          sed -i 's/agp = "9.1.1"/agp = "8.8.0"/g' gradle/libs.versions.toml
          sed -i 's/coreKtx = "1.18.0"/coreKtx = "1.15.0"/g' gradle/libs.versions.toml
          sed -i 's/junitVersion = "1.3.0"/junitVersion = "1.2.1"/g' gradle/libs.versions.toml
          sed -i 's/espressoCore = "3.7.0"/espressoCore = "3.6.1"/g' gradle/libs.versions.toml
          sed -i 's/kotlin = "2.2.10"/kotlin = "2.1.0"/g' gradle/libs.versions.toml
          sed -i 's/googleDevtoolsKsp = "2.3.5"/googleDevtoolsKsp = "2.1.0-1.0.29"/g' gradle/libs.versions.toml
          sed -i 's/robolectric = "4.16.1"/robolectric = "4.14.1"/g' gradle/libs.versions.toml
          sed -i 's/googleServices = "4.5.0"/googleServices = "4.4.2"/g' gradle/libs.versions.toml
          sed -i 's/gradle-9.3.1-bin.zip/gradle-8.11.1-bin.zip/g' gradle/wrapper/gradle-wrapper.properties

          # 2. Remove unused google-services plugin & MissingGoogleServicesStrategy (internal-only API)
          sed -i '/MissingGoogleServicesStrategy/d' app/build.gradle.kts
          sed -i '/libs.plugins.google.services/d' app/build.gradle.kts
          sed -i '/libs.plugins.google.services/d' build.gradle.kts
          sed -i '/googleServices.missing.passthrough/d' gradle.properties

          # 3. Replace AGP 9 compileSdk DSL block with standard compileSdk = 35 & targetSdk = 35
          sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 35/g' app/build.gradle.kts
          sed -i 's/targetSdk = 36/targetSdk = 35/g' app/build.gradle.kts

          # 4. Ensure kotlin-android plugin and matching jvmTarget = "11" are configured cleanly for AGP 8.8.0
          if ! grep -q "kotlin-android" gradle/libs.versions.toml; then
            sed -i '/\[plugins\]/a kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }' gradle/libs.versions.toml
            sed -i '/alias(libs.plugins.android.application)/a \  alias(libs.plugins.kotlin.android) apply false' build.gradle.kts
            sed -i '/alias(libs.plugins.android.application)/a \  alias(libs.plugins.kotlin.android)' app/build.gradle.kts
          fi

          # Add top-level kotlin { compilerOptions { jvmTarget } } at the end of app/build.gradle.kts
          if ! grep -q "JvmTarget.JVM_11" app/build.gradle.kts; then
            cat << 'EOF' >> app/build.gradle.kts

          kotlin {
            compilerOptions {
              jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
            }
          }
          EOF
          fi

          echo "=== Normalized app/build.gradle.kts ==="
          cat app/build.gradle.kts

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Signing Keystore & Environment Files
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          if [ ! -f my-upload-key.jks ]; then
            cp debug.keystore my-upload-key.jks
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Run Unit Tests
        run: |
          gradle :app:testDebugUnitTest --no-daemon --no-configuration-cache --stacktrace

      - name: Upload Doomsday Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Doomsday-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
