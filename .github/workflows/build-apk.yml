name: Build Doomsday APK

on:
  push:
    branches: [ "main", "master", "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Assemble Debug & Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Pre-Installed Android SDK & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"
          printf "\nd975f751698a77b662f1254ddbeed3901e976f5a" > "$SDK_DIR/licenses/intel-android-extra-license"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Normalize Build Config for Public GitHub Actions Runner
        run: |
          # 1. Normalize internal AI Studio container versions to publicly available Maven versions
          sed -i 's/agp = "9.1.1"/agp = "8.8.0"/g' gradle/libs.versions.toml
          sed -i 's/coreKtx = "1.18.0"/coreKtx = "1.15.0"/g' gradle/libs.versions.toml
          sed -i 's/junitVersion = "1.3.0"/junitVersion = "1.2.1"/g' gradle/libs.versions.toml
          sed -i 's/espressoCore = "3.7.0"/espressoCore = "3.6.1"/g' gradle/libs.versions.toml
          sed -i 's/kotlin = "2.2.10"/kotlin = "2.1.0"/g' gradle/libs.versions.toml
          sed -i 's/googleDevtoolsKsp = "2.3.5"/googleDevtoolsKsp = "2.1.0-1.0.29"/g' gradle/libs.versions.toml
          sed -i 's/robolectric = "4.16.1"/robolectric = "4.14.1"/g' gradle/libs.versions.toml
          sed -i 's/googleServices = "4.5.0"/googleServices = "4.4.2"/g' gradle/libs.versions.toml
          sed -i 's/gradle-9.3.1-bin.zip/gradle-8.11.1-bin.zip/g' gradle/wrapper/gradle-wrapper.properties

          if ! grep -q "kotlin-android" gradle/libs.versions.toml; then
            sed -i '/\[plugins\]/a kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }' gradle/libs.versions.toml
          fi

          # 2. Write a clean root build.gradle.kts for public CI
          cat << 'EOF' > build.gradle.kts
          plugins {
            alias(libs.plugins.android.application) apply false
            alias(libs.plugins.kotlin.android) apply false
            alias(libs.plugins.kotlin.compose) apply false
            alias(libs.plugins.google.devtools.ksp) apply false
            alias(libs.plugins.secrets) apply false
          }
          EOF

          # 3. Write a clean, self-contained app/build.gradle.kts for public CI (AGP 8.8.0 + Kotlin 2.1.0 + compileSdk 35)
          cat << 'EOF' > app/build.gradle.kts
          plugins {
            alias(libs.plugins.android.application)
            alias(libs.plugins.kotlin.android)
            alias(libs.plugins.kotlin.compose)
            alias(libs.plugins.google.devtools.ksp)
            alias(libs.plugins.secrets)
          }

          android {
            namespace = "com.example"
            compileSdk = 35

            defaultConfig {
              applicationId = "com.aistudio.doomsday.kxzpqr"
              minSdk = 24
              targetSdk = 35
              versionCode = 1
              versionName = "1.0"

              testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
            }

            signingConfigs {
              create("release") {
                val keystorePath = System.getenv("KEYSTORE_PATH") ?: "${rootDir}/my-upload-key.jks"
                storeFile = file(keystorePath)
                storePassword = System.getenv("STORE_PASSWORD") ?: "android"
                keyAlias = "upload"
                keyPassword = System.getenv("KEY_PASSWORD") ?: "android"
              }
              create("debugConfig") {
                storeFile = file("${rootDir}/debug.keystore")
                storePassword = "android"
                keyAlias = "androiddebugkey"
                keyPassword = "android"
              }
            }

            buildTypes {
              release {
                isCrunchPngs = false
                isMinifyEnabled = false
                proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                signingConfig = signingConfigs.getByName("release")
              }
              debug {
                signingConfig = signingConfigs.getByName("debugConfig")
              }
            }

            compileOptions {
              isCoreLibraryDesugaringEnabled = true
              sourceCompatibility = JavaVersion.VERSION_11
              targetCompatibility = JavaVersion.VERSION_11
            }

            kotlinOptions {
              jvmTarget = "11"
            }

            buildFeatures {
              compose = true
              buildConfig = true
            }

            testOptions {
              unitTests {
                isIncludeAndroidResources = true
              }
            }

            dependenciesInfo {
              includeInApk = false
              includeInBundle = true
            }
          }

          secrets {
            propertiesFileName = ".env"
            defaultPropertiesFileName = ".env.example"
            ignoreList.add("FIREBASE_APPCHECK_DEBUG_TOKEN")
          }

          dependencies {
            coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
            implementation(platform(libs.androidx.compose.bom))
            implementation(libs.androidx.activity.compose)
            implementation(libs.androidx.compose.material.icons.core)
            implementation(libs.androidx.compose.material.icons.extended)
            implementation(libs.androidx.compose.material3)
            implementation(libs.androidx.compose.ui)
            implementation(libs.androidx.compose.ui.graphics)
            implementation(libs.androidx.compose.ui.tooling.preview)
            implementation(libs.androidx.core.ktx)
            implementation(libs.androidx.datastore.preferences)
            implementation(libs.androidx.lifecycle.runtime.compose)
            implementation(libs.androidx.lifecycle.runtime.ktx)
            implementation(libs.androidx.lifecycle.viewmodel.compose)
            implementation(libs.kotlinx.coroutines.android)
            implementation(libs.kotlinx.coroutines.core)
            testImplementation(libs.androidx.compose.ui.test.junit4)
            testImplementation(libs.androidx.core)
            testImplementation(libs.androidx.junit)
            testImplementation(libs.junit)
            testImplementation(libs.kotlinx.coroutines.test)
            testImplementation(libs.robolectric)
            androidTestImplementation(platform(libs.androidx.compose.bom))
            androidTestImplementation(libs.androidx.compose.ui.test.junit4)
            androidTestImplementation(libs.androidx.espresso.core)
            androidTestImplementation(libs.androidx.junit)
            androidTestImplementation(libs.androidx.runner)
            debugImplementation(libs.androidx.compose.ui.test.manifest)
            debugImplementation(libs.androidx.compose.ui.tooling)
          }
          EOF

          sed -i '/googleServices.missing.passthrough/d' gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Signing Keystore & Environment Files
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          if [ ! -f my-upload-key.jks ]; then
            cp debug.keystore my-upload-key.jks
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Run Unit Tests
        run: |
          gradle :app:testDebugUnitTest --no-daemon --no-configuration-cache --stacktrace

      - name: Upload Doomsday Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Doomsday-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
